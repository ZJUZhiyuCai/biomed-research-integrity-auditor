repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: ["--select=E9,F63,F7,F82"]

  - repo: local
    hooks:
      - id: no-audit-outputs
        name: Do not commit local audit outputs
        entry: bash -c 'test -z "$(git ls-files audit_outputs evals/outputs tmp dist build | grep -v "^evals/outputs/.gitkeep$")"'
        language: system
        pass_filenames: false

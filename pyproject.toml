[project]
name = "biomed-research-integrity-auditor"
version = "0.6.2"
description = "Codex skill and detector pipeline for biomedical research integrity risk auditing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "Pillow>=10.0,<12",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<6",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.0,<5",
  "openpyxl>=3.1,<4",
  "pypdf>=4.0,<7",
  "PyMuPDF>=1.24,<2",
  "requests>=2.31,<3",
  "tomli>=2.0,<3; python_version < '3.11'"
]

[project.optional-dependencies]
webapp = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1"
]
ocr = [
  "pytesseract>=0.3,<0.4"
]
benchmark = [
  "psutil>=5.9,<8"
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.0,<2",
  "pre-commit>=3.0,<5",
  "pytest>=8.0,<9",
  "ruff>=0.5,<1",
  "setuptools>=77,<84",
  "types-PyYAML>=6.0,<7"
]

[project.scripts]
bria-bench = "benchmarks.bria_bench.cli:main"
biomed-audit = "scripts.audit_package:main"
biomed-audit-diff = "scripts.compare_audit_runs:main"
biomed-audit-web = "webapp.__main__:main"
biomed-image-global-near-duplicate = "detectors.image.global_near_duplicate:main"
biomed-image-keypoint-geometric-match = "detectors.image.keypoint_geometric_match:main"
biomed-pseudoreplication-screen = "detectors.stats.pseudoreplication_screen:main"
biomed-risk-cap-engine = "calibrators.risk_cap_engine:main"
biomed-self-audit-webapp = "webapp.__main__:main"

[tool.setuptools]
include-package-data = true
packages = ["benchmarks.bria_bench", "calibrators", "detectors", "detectors.image", "detectors.stats", "detectors.text", "provenance", "schemas", "scripts", "scripts.pipeline", "skill", "webapp", "webapp.backend"]

[tool.setuptools.package-data]
schemas = ["*.json", "*.yaml"]
"benchmarks.bria_bench" = [
  "README.md",
  "REVIEWER_GUIDE.md",
  "benchmark_manifest*.json",
  "annotations/**/*.json",
  "cases/**/*",
  "results/.gitkeep",
  "schemas/annotation.schema.json",
  "schemas/benchmark_manifest.schema.json",
  "schemas/metrics.schema.json",
  "schemas/observation.schema.json",
  "schemas/reviewer_form_completed.schema.json",
  "schemas/reviewer_form_template.schema.json",
  "schemas/reviewer_mapping.schema.json",
  "schemas/reviewer_packet_manifest.schema.json",
  "schemas/run_result.schema.json"
]
webapp = ["frontend/dist/*.html", "frontend/dist/assets/*"]
skill = [
  "biomed-research-integrity-auditor/*.md",
  "biomed-research-integrity-auditor/agents/*.yaml",
  "biomed-research-integrity-auditor/references/*.md",
  "biomed-research-integrity-auditor/scripts/*.py",
  "biomed-research-integrity-auditor/templates/*.md",
  "biomed-research-integrity-auditor/templates/*.json",
  "biomed-research-integrity-auditor/templates/submission_qc/*.csv",
  "biomed-research-integrity-auditor/templates/submission_qc/*.yaml",
  "biomed-research-integrity-auditor/templates/reporting_checklists/*.yaml"
]

[tool.setuptools.exclude-package-data]
"benchmarks.bria_bench" = [
  "runs/**", "**/runs/**",
  "reviewer_packets/**", "**/reviewer_packets/**",
  "reviewer-packets/**", "**/reviewer-packets/**",
  "reviewer_packet/**", "**/reviewer_packet/**",
  "reviewer-packet/**", "**/reviewer-packet/**",
  "mappings/**", "**/mappings/**",
  "reviewer_mappings/**", "**/reviewer_mappings/**",
  "reviewer-mappings/**", "**/reviewer-mappings/**",
  "api_cache/**", "**/api_cache/**",
  "api-cache/**", "**/api-cache/**",
  ".api_cache/**", "**/.api_cache/**",
  ".api-cache/**", "**/.api-cache/**",
  "cache/**", "**/cache/**",
  ".cache/**", "**/.cache/**",
  "metrics/**", "**/metrics/**",
  "local_metrics/**", "**/local_metrics/**",
  "local-metrics/**", "**/local-metrics/**",
  "seeds/**", "**/seeds/**",
  "identity/**", "**/identity/**",
  "identities/**", "**/identities/**",
  "**/results/**",
  "run_summary.json", "**/run_summary.json",
  "run-summary.json", "**/run-summary.json",
  "metrics.json", "**/metrics.json",
  "metrics-*.json", "**/metrics-*.json",
  "metrics_*.json", "**/metrics_*.json",
  "local_metrics*.json", "**/local_metrics*.json",
  "local-metrics*.json", "**/local-metrics*.json",
  "cases/reviewer_mapping*.json", "cases/**/reviewer_mapping*.json",
  "annotations/reviewer_mapping*.json", "annotations/**/reviewer_mapping*.json",
  "results/reviewer_mapping*.json",
  "cases/reviewer-mapping*.json", "cases/**/reviewer-mapping*.json",
  "annotations/reviewer-mapping*.json", "annotations/**/reviewer-mapping*.json",
  "results/reviewer-mapping*.json",
  "*_mapping.json", "**/*_mapping.json",
  "*-mapping.json", "**/*-mapping.json",
  "cases/reviewer_packet*.json", "cases/**/reviewer_packet*.json",
  "annotations/reviewer_packet*.json", "annotations/**/reviewer_packet*.json",
  "results/reviewer_packet*.json",
  "reviewer_packet*.zip", "**/reviewer_packet*.zip",
  "reviewer-packet*.json", "**/reviewer-packet*.json",
  "reviewer-packet*.zip", "**/reviewer-packet*.zip",
  "seed*.json", "**/seed*.json",
  "seed*.txt", "**/seed*.txt",
  "*identity*.json", "**/*identity*.json",
  "*api_cache*.json", "**/*api_cache*.json",
  "*api-cache*.json", "**/*api-cache*.json"
]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
